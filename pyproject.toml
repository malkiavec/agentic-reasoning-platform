[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-reasoning-platform"
version = "0.3.0"
description = "Security-first production platform for long-horizon agentic reasoning."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "celery>=5.4,<6",
  "redis>=5,<6",
  "pgvector>=0.3,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "jsonschema>=4.23,<5",
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9","pytest-asyncio>=0.25,<1","ruff>=0.9,<1","mypy>=1.14,<2"]
[tool.setuptools.packages.find]
include = ["apps*","packages*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"