[project]
name = "agentic-reasoning-platform"
version = "0.1.0"
description = "Security-first long-horizon agent runtime"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "celery>=5.4,<6",
  "redis>=5,<6",
  "pgvector>=0.3,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
asyncio_mode = "auto"
