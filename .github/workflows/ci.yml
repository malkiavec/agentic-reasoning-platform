name: CI
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agentic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agentic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://agent:agent@localhost:5432/agentic
      PSQL_DATABASE_URL: postgresql://agent:agent@localhost:5432/agentic
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: psql "$PSQL_DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: python -c "import asyncio; from packages.db.session import engine; from packages.db.bootstrap import create_schema; asyncio.run(create_schema(engine))"
      - run: sh scripts/migrate.sh
      - run: ruff check . --select F --ignore F401
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package.json
      - run: npm install
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
